<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papelaria</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Papelaria</h1>
        <nav>
            <a href="#cadastrar">Cadastrar produto</a>
            <a href="#consultar">Consultar produto</a>
        </nav>
    </header>
    <main>
        <section id="cadastrar" class="cartao">
            <h2>cadastrar produto</h2>
            <form action="/cadastrar" method="post">
                <label>Nome
                    <input name="nome">
                    </label>
                    <label>Preço (R$)
                        <input name="preco">
                    </label>
                    <label>Quantidade
                        <input name="quantidade">
                    </label>
                    <button class="botao">cadastrar</button>
            </form>
        </section>
    </main>
</body>
</html>
